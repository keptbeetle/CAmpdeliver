name: Android APK

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Android ABI to package for manual testing
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - x86_64
  pull_request:
    paths:
      - "apps/expo/**"
      - "packages/api/**"
      - "packages/validators/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
      - "tooling/github/setup/**"
  push:
    branches: ["main"]
    paths:
      - "apps/expo/**"
      - "packages/api/**"
      - "packages/validators/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
      - "tooling/github/setup/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ inputs.architecture || 'arm64-v8a' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  deployments: read

jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_ARCHITECTURE: ${{ inputs.architecture || 'arm64-v8a' }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CHECKOUT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "Checked out $actual_sha instead of requested commit $TARGET_SHA" >&2
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup workspace
        uses: ./tooling/github/setup

      - name: Resolve branch-aware Vercel backend
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_PUBLIC_PRODUCTION_API_URL: https://c-ampdeliver-nextjs.vercel.app
        run: node apps/expo/scripts/resolve-backend-url.mjs --github-output

      - name: Prepare build environment
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend.outputs.api_url }}
        shell: bash
        run: |
          set -euo pipefail

          required=(
            EXPO_PUBLIC_API_URL
            EXPO_PUBLIC_SUPABASE_ANON_KEY
            EXPO_PUBLIC_SUPABASE_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Android build variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          umask 077
          {
            printf 'EXPO_PUBLIC_API_URL=%s\n' "$EXPO_PUBLIC_API_URL"
            printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$EXPO_PUBLIC_SUPABASE_URL"
          } > .env

      - name: Generate Android project
        env:
          EXPO_API_URL_OVERRIDE: ${{ steps.backend.outputs.api_url }}
        run: pnpm -F @acme/expo with-env expo prebuild --platform android --no-install

      - name: Build bundled preview APK
        working-directory: apps/expo/android
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend.outputs.api_url }}
        run: ./gradlew --no-daemon -PreactNativeArchitectures="$BUILD_ARCHITECTURE" assembleRelease

      - name: Verify bundled preview environment
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend.outputs.api_url }}
        run: pnpm -F @acme/expo verify:android-bundle-env

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campdeliver-android-${{ env.BUILD_ARCHITECTURE }}-${{ steps.backend.outputs.short_sha }}
          path: apps/expo/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
