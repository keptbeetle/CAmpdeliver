name: Android APK

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Android ABI to package for manual testing
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - x86_64
  pull_request:
    paths:
      - "apps/expo/**"
      - "packages/api/**"
      - "packages/validators/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
      - "tooling/github/setup/**"
  push:
    branches: ["main"]
    paths:
      - "apps/expo/**"
      - "packages/api/**"
      - "packages/validators/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
      - "tooling/github/setup/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ inputs.architecture || 'arm64-v8a' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_ARCHITECTURE: ${{ inputs.architecture || 'arm64-v8a' }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CHECKOUT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "Checked out $actual_sha instead of requested commit $TARGET_SHA" >&2
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup workspace
        uses: ./tooling/github/setup

      - name: Resolve same-commit Vercel backend
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_API_URL: https://c-ampdeliver-nextjs.vercel.app
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            wanted_environment="Production"
          else
            wanted_environment="Preview"
          fi

          echo "Waiting for Vercel $wanted_environment deployment of $TARGET_SHA"
          deadline=$((SECONDS + 1200))
          deployment_url=""
          resolved_environment="$wanted_environment"
          fallback_reason=""

          while (( SECONDS < deadline )); do
            if [[ "$wanted_environment" == "Preview" ]]; then
              commit_status="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/status")"
              vercel_state="$(
                jq -r '
                  [.statuses[] | select(.context == "Vercel")]
                  | sort_by(.updated_at)
                  | last
                  | .state // empty
                ' <<<"$commit_status"
              )"
              vercel_description="$(
                jq -r '
                  [.statuses[] | select(.context == "Vercel")]
                  | sort_by(.updated_at)
                  | last
                  | .description // empty
                ' <<<"$commit_status"
              )"

              if [[ "$vercel_state" == "success" && "$vercel_description" == "Skipped - Not affected" ]]; then
                deployment_url="${PRODUCTION_API_URL%/}"
                resolved_environment="Production"
                fallback_reason="Vercel skipped Preview because this commit does not affect the backend"
                break
              fi

              if [[ "$vercel_state" == "failure" || "$vercel_state" == "error" ]]; then
                echo "Vercel Preview status failed for $TARGET_SHA: $vercel_description" >&2
                exit 1
              fi
            fi

            deployments="$(gh api "/repos/$GITHUB_REPOSITORY/deployments?sha=$TARGET_SHA&per_page=100")"
            deployment_id="$(
              jq -r --arg environment "$wanted_environment" '
                [.[] | select(.environment == $environment)]
                | sort_by(.created_at)
                | last
                | .id // empty
              ' <<<"$deployments"
            )"

            if [[ -n "$deployment_id" ]]; then
              statuses="$(gh api "/repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=100")"
              latest_state="$(jq -r 'sort_by(.created_at) | last | .state // empty' <<<"$statuses")"
              deployment_url="$(
                jq -r --arg environment "$wanted_environment" '
                  [.[]
                    | select(.state == "success")
                    | select((.environment // $environment) == $environment)
                    | select((.environment_url // "") != "")]
                  | sort_by(.created_at)
                  | last
                  | .environment_url // empty
                ' <<<"$statuses"
              )"

              if [[ -n "$deployment_url" ]]; then
                break
              fi

              if [[ "$latest_state" == "failure" || "$latest_state" == "error" ]]; then
                echo "Vercel $wanted_environment deployment failed for $TARGET_SHA" >&2
                exit 1
              fi
            fi

            sleep 10
          done

          if [[ -z "$deployment_url" ]]; then
            echo "Timed out waiting for a successful Vercel $wanted_environment deployment of $TARGET_SHA" >&2
            exit 1
          fi

          api_url="${deployment_url%/}"

          if [[ ! "$api_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "Refusing unexpected backend URL: $api_url" >&2
            exit 1
          fi

          short_sha="${TARGET_SHA:0:12}"
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=${deployment_url%/}" >> "$GITHUB_OUTPUT"
          echo "environment=$resolved_environment" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          if [[ -n "$fallback_reason" ]]; then
            echo "$fallback_reason; using $resolved_environment backend for $short_sha: $api_url"
          else
            echo "Resolved $resolved_environment backend for $short_sha: $api_url"
          fi

      - name: Prepare build environment
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend.outputs.api_url }}
        shell: bash
        run: |
          set -euo pipefail

          required=(
            EXPO_PUBLIC_API_URL
            EXPO_PUBLIC_SUPABASE_ANON_KEY
            EXPO_PUBLIC_SUPABASE_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Android build variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          umask 077
          {
            printf 'EXPO_PUBLIC_API_URL=%s\n' "$EXPO_PUBLIC_API_URL"
            printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$EXPO_PUBLIC_SUPABASE_URL"
          } > .env

      - name: Generate Android project
        run: pnpm -F @acme/expo with-env expo prebuild --platform android --no-install

      - name: Build bundled preview APK
        working-directory: apps/expo/android
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend.outputs.api_url }}
        run: ./gradlew --no-daemon -PreactNativeArchitectures="$BUILD_ARCHITECTURE" assembleRelease

      - name: Verify bundled preview environment
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend.outputs.api_url }}
        run: pnpm -F @acme/expo verify:android-bundle-env

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campdeliver-android-${{ env.BUILD_ARCHITECTURE }}-${{ steps.backend.outputs.short_sha }}
          path: apps/expo/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
