name: Android APK

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Android target for manual testing
        required: true
        default: universal
        type: choice
        options:
          - universal
          - arm64-v8a
          - x86_64
  pull_request:
    paths:
      - "apps/expo/**"
      - "packages/api/**"
      - "packages/validators/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
      - "tooling/github/setup/**"
  push:
    branches: ["main"]
    paths:
      - "apps/expo/**"
      - "packages/api/**"
      - "packages/validators/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
      - "tooling/github/setup/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ inputs.architecture || 'universal' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  deployments: read

jobs:
  preview-apk:
    name: preview-apk (${{ inputs.architecture || 'universal' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_ARCHITECTURES: ${{ inputs.architecture == 'arm64-v8a' && 'arm64-v8a' || inputs.architecture == 'x86_64' && 'x86_64' || 'arm64-v8a,x86_64' }}
      APK_VARIANT: ${{ inputs.architecture || 'universal' }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CHECKOUT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      CAMPDELIVER_ANDROID_VERSION_CODE: ${{ github.run_number }}
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "Checked out $actual_sha instead of requested commit $TARGET_SHA" >&2
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup workspace
        uses: ./tooling/github/setup

      - name: Resolve branch-aware Vercel backend
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_PUBLIC_PRODUCTION_API_URL: https://c-ampdeliver-nextjs.vercel.app
        run: node apps/expo/scripts/resolve-backend-url.mjs --github-output

      - name: Prepare build environment
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend.outputs.api_url }}
        shell: bash
        run: |
          set -euo pipefail

          required=(
            EXPO_PUBLIC_API_URL
            EXPO_PUBLIC_SUPABASE_ANON_KEY
            EXPO_PUBLIC_SUPABASE_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Android build variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          umask 077
          {
            printf 'EXPO_PUBLIC_API_URL=%s\n' "$EXPO_PUBLIC_API_URL"
            printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$EXPO_PUBLIC_SUPABASE_URL"
          } > .env

      - name: Generate Android project
        env:
          EXPO_API_URL_OVERRIDE: ${{ steps.backend.outputs.api_url }}
        run: pnpm -F @acme/expo with-env expo prebuild --platform android --no-install

      - name: Build bundled preview APK
        working-directory: apps/expo/android
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend.outputs.api_url }}
        run: ./gradlew --no-daemon -PreactNativeArchitectures="$BUILD_ARCHITECTURES" assembleRelease

      - name: Verify bundled preview environment
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.backend.outputs.api_url }}
        run: pnpm -F @acme/expo verify:android-bundle-env

      - name: Prepare clearly labeled APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          source_apk="apps/expo/android/app/build/outputs/apk/release/app-release.apk"
          short_sha="${{ steps.backend.outputs.short_sha }}"

          case "$APK_VARIANT" in
            universal)
              artifact_name="campdeliver-UNIVERSAL-phone-emulator-$short_sha"
              apk_filename="CAmpDeliver-universal-phone-emulator-$short_sha.apk"
              expected_abis=(arm64-v8a x86_64)
              target_note="Installs on ARM64 Android phones and x86_64 test emulators."
              ;;
            arm64-v8a)
              artifact_name="campdeliver-PHONE-arm64-v8a-$short_sha"
              apk_filename="CAmpDeliver-PHONE-arm64-v8a-$short_sha.apk"
              expected_abis=(arm64-v8a)
              target_note="PHONE build: installs on ARM64 Android devices; not x86_64 emulators."
              ;;
            x86_64)
              artifact_name="campdeliver-EMULATOR-ONLY-x86_64-$short_sha"
              apk_filename="CAmpDeliver-EMULATOR-ONLY-x86_64-$short_sha.apk"
              expected_abis=(x86_64)
              target_note="EMULATOR-ONLY build: do not install this APK on a physical ARM Android phone."
              ;;
            *)
              echo "Unknown APK variant: $APK_VARIANT" >&2
              exit 1
              ;;
          esac

          apk_entries="$(unzip -Z1 "$source_apk")"
          for abi in "${expected_abis[@]}"; do
            if ! grep -q "^lib/$abi/" <<<"$apk_entries"; then
              echo "APK is missing expected native ABI $abi" >&2
              exit 1
            fi
          done

          mkdir -p dist
          cp "$source_apk" "dist/$apk_filename"
          {
            echo "artifact_name=$artifact_name"
            echo "apk_filename=$apk_filename"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### CAmpDeliver Android preview"
            echo
            echo "**$target_note**"
            echo
            echo "- Variant: \`$APK_VARIANT\`"
            echo "- Native ABIs: \`$BUILD_ARCHITECTURES\`"
            echo "- Android version code: \`$CAMPDELIVER_ANDROID_VERSION_CODE\`"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- APK filename: \`$apk_filename\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: dist/${{ steps.apk.outputs.apk_filename }}
          if-no-files-found: error
          retention-days: 14
